<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  </head>
  <body>
    <header>
      <img src="Imagens/logo.png" />
      <h1 class="arimo">Sensorial - Dashboard</h1>
      <div>
        <div id="status-signal" class="offline"></div>
        <p id="status-text" class="offline" class="arimo">Offline</p>
      </div>
    </header>
    <main>
      <section id="controles">
        <button onclick="atualizarDados()" class="arimo"><i class="fa-solid fa-arrows-rotate"></i></button>
        <button id="alterar-status" onclick="alterarStatus()"><i class="fa-solid fa-power-off"></i></button>
      </section>
      <section id="dashboard">
      </section>
    </main>
    <footer class="arimo">&copy;Otávio Saturnino</footer>

    <script src="script.js"></script>
  </body>
</html>
